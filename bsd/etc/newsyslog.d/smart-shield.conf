# Smart Shield — FreeBSD log rotation (newsyslog)
#
# Install:
#   cp bsd/etc/newsyslog.d/smart-shield.conf /usr/local/etc/newsyslog.d/smart-shield.conf
#   newsyslog -v   # dry-run to verify
#
# Column layout:
#   logfile  [owner:group]  mode  count  size_KB  when  flags
#
# Flags used:
#   J = bzip2-compress rotated file
#   C = create log file if it does not already exist
#
# when = @T00  → rotate daily at midnight
# size = *     → no size limit (time-only rotation)
# size = 4096  → rotate when file reaches 4 MB (whichever comes first)
# count        → number of old compressed log files to keep
# ─────────────────────────────────────────────────────────────────────────────

# Audit trail — keep 90 days, rotate daily, hard cap at 10 MB
/var/log/smart-shield/audit.log     root:wheel  640  90  10240  @T00  JC

# Gunicorn application log — keep 30 days
/var/log/smart-shield/app.log       root:wheel  640  30  *      @T00  JC

# Gunicorn HTTP access log — keep 30 days, cap at 50 MB per file
/var/log/smart-shield/access.log    root:wheel  640  30  51200  @T00  JC

# Gunicorn error log — keep 30 days
/var/log/smart-shield/error.log     root:wheel  640  30  *      @T00  JC
