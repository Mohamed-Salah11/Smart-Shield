<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Status: Captive Portal - pfSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 70px; background: #f5f5f5; font-family: Arial, sans-serif; }
    .navbar-brand { font-weight: bold; }
    .breadcrumb { background: #fff; border: 1px solid #ddd; margin-bottom: 20px; }
    .table thead { background: #333; color: #fff; }
    .table thead th { font-weight: normal; }
    .btn-show-activity { background: #5bc0de; border-color: #46b8da; }
    .btn-show-activity:hover { background: #31b0d5; }
    .btn-disconnect-all { background: #d9534f; border-color: #d43f3a; }
    .btn-disconnect-all:hover { background: #c9302c; }
    .btn { margin-right: 10px; }
    .panel { box-shadow: none; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}"></a>
      </div>
    </div>
  </nav>

  <ol class="breadcrumb container-fluid">
    <li><a href="{{ url_for('status') }}">Status</a></li>
    <li><a href="#">Captive Portal</a></li>
    <li class="active">sd</li>  <!-- زي الصورة -->
  </ol>

  <div class="container-fluid">
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title">Users Logged In (0)</h3>
      </div>
      <div class="panel-body">
        <table class="table table-striped table-condensed">
          <thead>
            <tr>
              <th>IP address</th>
              <th>MAC address</th>
              <th>Username</th>
              <th>Session start</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- فارغ -->
          </tbody>
        </table>

        <div class="text-right">
          <button class="btn btn-info btn-show-activity">
            <span class="glyphicon glyphicon-plus"></span> Show Last Activity
          </button>
          <button class="btn btn-danger btn-disconnect-all">
            <span class="glyphicon glyphicon-trash"></span> Disconnect All Users
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>
  <script>
    // الأزرار (مثال بسيط، مش شغالة فعلياً لأن مفيش يوزرز)
    $('.btn-show-activity').click(function() {
      alert('No users to show activity for.');
    });
    $('.btn-disconnect-all').click(function() {
      alert('No users to disconnect.');
    });
  </script>
</body>
</html>
