{% extends 'base.html' %}

{% block head %}
<style>
  .breadcrumb { background: #fff; border: 1px solid #ddd; margin-bottom: 20px; }
  .table thead { background: #333; color: #fff; }
  .table thead th { font-weight: normal; }
  .btn-show-activity { background: #5bc0de; border-color: #46b8da; }
  .btn-show-activity:hover { background: #31b0d5; }
  .btn-disconnect-all { background: #d9534f; border-color: #d43f3a; }
  .btn-disconnect-all:hover { background: #c9302c; }
  .btn { margin-right: 10px; }
  .card { box-shadow: none; border: 1px solid #ddd; }
</style>
{% endblock %}

{% block main %}
<div class="container-fluid">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Status</a></li>
      <li class="breadcrumb-item active" aria-current="page">Captive Portal</li>
    </ol>
  </nav>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title mb-0">Users Logged In (0)</h3>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>IP address</th>
              <th>MAC address</th>
              <th>Username</th>
              <th>Session start</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" class="text-center text-muted">No users currently logged in</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-end mt-3">
        <button class="btn btn-info btn-show-activity">
          <i class="bi bi-plus-circle"></i> Show Last Activity
        </button>
        <button class="btn btn-danger btn-disconnect-all">
          <i class="bi bi-trash"></i> Disconnect All Users
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelector('.btn-show-activity').addEventListener('click', function() {
    alert('No users to show activity for.');
  });
  
  document.querySelector('.btn-disconnect-all').addEventListener('click', function() {
    alert('No users to disconnect.');
  });
</script>
{% endblock %}
