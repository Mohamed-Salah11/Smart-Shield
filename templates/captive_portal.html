{% extends 'base.html' %}
{% block main %}
<div class="container">

  <div class="ss-page-header">
    <div>
      <h1 class="ss-page-title">Captive Portal Sessions</h1>
      <p class="ss-page-desc">Active authenticated portal sessions</p>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" onclick="loadSessions()">
        <i class="fa-solid fa-rotate me-1"></i>Refresh
      </button>
      <button type="button" class="btn btn-danger" onclick="disconnectAll()">
        <i class="fa-solid fa-plug-circle-xmark me-1"></i>Disconnect All
      </button>
    </div>
  </div>

  <div class="ss-card">
    <div class="ss-card-head">
      <div class="ss-card-icon"><i class="fa-solid fa-users"></i></div>
      <div>
        <div class="ss-card-title">Active Sessions</div>
        <div class="ss-card-subtitle" id="session-count">Loading…</div>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="table table-hover mb-0" style="font-size:.85rem;">
        <thead style="background:var(--border-color-soft);">
          <tr>
            <th style="padding:10px 14px;">IP Address</th>
            <th>MAC Address</th>
            <th>Username</th>
            <th>Session Start</th>
            <th>Expires</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sessions-tbody">
          <tr><td colspan="6" style="text-align:center;padding:28px;color:var(--muted);">Loading sessions…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function loadSessions() {
  fetch('/services/api/captive-portal/sessions')
    .then(r => r.json())
    .then(data => {
      const sessions = data.sessions || [];
      document.getElementById('session-count').textContent = sessions.length + ' user' + (sessions.length === 1 ? '' : 's') + ' logged in';
      const tbody = document.getElementById('sessions-tbody');
      if (!sessions.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--muted);">No users currently logged in</td></tr>';
        return;
      }
      tbody.innerHTML = sessions.map(s => `
  <tr>
    <td style="padding:8px 14px;font-family:monospace;font-size:.8rem;">${escapeHtml(s.ip_address)}</td>
    <td style="font-family:monospace;font-size:.8rem;">${escapeHtml(s.mac_address || '—')}</td>
    <td>${escapeHtml(s.username || '—')}</td>
    <td>${escapeHtml(s.created_at || '—')}</td>
    <td>${escapeHtml(formatExpiry(s.expires_at))}</td>
    <td>
      <button class="btn btn-sm btn-danger" onclick="disconnectUser(${Number(s.id)})">
        <i class="fa-solid fa-plug-circle-xmark"></i>
      </button>
    </td>
  </tr>`).join('');
    })
    .catch(() => {
      document.getElementById('session-count').textContent = '0 users logged in';
      document.getElementById('sessions-tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--muted);">No users currently logged in</td></tr>';
    });
}

function disconnectUser(sessionId) {
  if (!confirm('Disconnect this user?')) return;
  fetch(`/services/api/captive-portal/sessions/${sessionId}/logout`, {
    method: 'POST'
  }).then(() => loadSessions());
}

function disconnectAll() {
  if (!confirm('Disconnect all portal users?')) return;
  fetch('/services/api/captive-portal/sessions/logout-all', {method:'POST'})
    .then(() => loadSessions());
}
function formatExpiry(ts) {
  if (!ts) return '—';
  const d = new Date(Number(ts) * 1000);
  if (isNaN(d.getTime())) return String(ts);
  return d.toLocaleString();
}

function escapeHtml(t) {
  if (!t) return '';
  return String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

document.addEventListener('DOMContentLoaded', loadSessions);
</script>
{% endblock %}
