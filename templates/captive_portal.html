{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">
	<span>Status / Captive Portal</span>
</div>

<div class="settings-section" style="padding: 20px;">
	<h5>Users Logged In (0)</h5>
	
	<table>
		<thead>
			<tr>
				<th>IP address</th>
				<th>MAC address</th>
				<th>Username</th>
				<th>Session start</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td colspan="5" class="text-center text-muted">No users currently logged in</td>
			</tr>
		</tbody>
	</table>

	<div class="d-flex gap-2 mt-3">
		<button type="button" class="btn btn-info btn-show-activity">Show Last Activity</button>
		<button type="button" class="btn btn-danger btn-disconnect-all">Disconnect All Users</button>
	</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
	const btnShowActivity = document.querySelector('.btn-show-activity');
	const btnDisconnectAll = document.querySelector('.btn-disconnect-all');
	
	if (btnShowActivity) {
		btnShowActivity.addEventListener('click', function() {
			alert('No users to show activity for.');
		});
	}
	
	if (btnDisconnectAll) {
		btnDisconnectAll.addEventListener('click', function() {
			alert('No users to disconnect.');
		});
	}
});
</script>
{% endblock %}
