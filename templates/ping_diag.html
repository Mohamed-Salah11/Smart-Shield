{% extends 'base.html' %}

{% block main %}
<div class="container">
  <div class="page-header">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="{{ url_for('system.dashboard') }}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('diagnostics.diagnostics_home') }}">Diagnostics</a></li>
        <li class="breadcrumb-item active">Ping</li>
      </ol>
    </nav>
    <h1><i class="fa fa-satellite-dish me-2 text-primary"></i>Ping</h1>
    <p class="lead">Send ICMP echo requests to test host reachability.</p>
  </div>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="section">
        <div class="section-header"><h2 class="mb-0">Parameters</h2></div>
        <div class="section-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Host / IP</label>
            <input type="text" id="ping-host" class="form-control" placeholder="8.8.8.8 or example.com" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Count</label>
            <select id="ping-count" class="form-select">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
              <option value="20">20</option>
            </select>
          </div>
          <button id="btn-ping" class="btn btn-primary w-100">
            <i class="fa fa-paper-plane me-2"></i>Send Ping
          </button>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="section h-100">
        <div class="section-header d-flex justify-content-between align-items-center">
          <h2 class="mb-0">Result</h2>
          <button id="btn-clear" class="btn btn-sm btn-outline-secondary d-none">Clear</button>
        </div>
        <div class="section-body p-0">
          <pre id="ping-output" style="
            min-height:220px;background:var(--bg);color:var(--text-color);
            font-size:.82rem;padding:1rem;margin:0;white-space:pre-wrap;
            font-family:'Courier New',monospace;border-radius:0 0 8px 8px;
          ">Waiting for input…</pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('btn-ping').addEventListener('click', function () {
  const host  = document.getElementById('ping-host').value.trim();
  const count = document.getElementById('ping-count').value;
  if (!host) { alert('Enter a host or IP address.'); return; }
  const out = document.getElementById('ping-output');
  out.textContent = 'Pinging ' + host + '…';
  this.disabled = true;
  document.getElementById('btn-clear').classList.add('d-none');
  fetch('/diagnostics/api/ping', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ host, count: parseInt(count) })
  })
  .then(r => r.json())
  .then(d => {
    out.textContent = d.output || d.error || 'No output.';
    document.getElementById('btn-clear').classList.remove('d-none');
  })
  .catch(e => { out.textContent = 'Request failed: ' + e.message; })
  .finally(() => { document.getElementById('btn-ping').disabled = false; });
});
document.getElementById('btn-clear').addEventListener('click', function () {
  document.getElementById('ping-output').textContent = 'Waiting for input…';
  this.classList.add('d-none');
});
</script>
{% endblock %}
