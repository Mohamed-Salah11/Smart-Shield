<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Unavailable — Smart Shield</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    width: 100%;
    max-width: 380px;
    text-align: center;
    padding: 2.5rem 2rem;
  }
  .icon  { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.2rem; font-weight: 700; color: #374151; margin-bottom: .5rem; }
  p  { font-size: .9rem;  color: #6b7280; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#9888;&#65039;</div>
  <h1>Captive Portal Disabled</h1>
  <p>The network portal is currently not active. Please contact your network administrator.</p>
</div>
</body>
</html>
