{% extends 'base.html' %}
{% set title = "Edit Static Route" %}

{% block main %}

<div class="container">
    <div class="ss-page-header">
      <div>
        <h1 class="ss-page-title">Edit Static Route</h1>
        <p class="ss-page-desc">Configure a static network route</p>
      </div>
    </div>

    <div class="ss-card">
      <div class="ss-card-head">
        <div class="ss-card-icon"><i class="fa-solid fa-route"></i></div>
        <div><div class="ss-card-title">Static Route Configuration</div></div>
      </div>
      <div class="ss-card-body">
            <form method="post" action="{{ url_for('routing.static_route_edit', route_id=route_id) if route_id else url_for('routing.static_route_edit') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3 row align-items-center">
                    <label for="destination" class="col-sm-3 col-form-label fw-semibold">Destination Network</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="destination" name="destination"
                               value="{{ route.destination if route else '' }}" placeholder="e.g. 192.168.2.0/24" required>
                        <small class="text-muted">Destination network in CIDR notation</small>
                    </div>
                </div>

                <div class="mb-3 row align-items-center">
                    <label for="gateway_id" class="col-sm-3 col-form-label fw-semibold">Gateway</label>
                    <div class="col-sm-9">
                        <select class="form-select" id="gateway_id" name="gateway_id">
                            <option value="">— Select Gateway —</option>
                            {% for gw in gateways %}
                            <option value="{{ gw.id }}" {% if route and route.gateway_id == gw.id %}selected{% endif %}>
                                {{ gw.name }} ({{ gw.gateway }}) — {{ gw.interface }}
                            </option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Select a configured gateway for this route</small>
                    </div>
                </div>

                <div class="mb-3 row align-items-center">
                    <label for="description" class="col-sm-3 col-form-label fw-semibold">Description</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="description" name="description"
                               value="{{ route.description if route else '' }}" placeholder="Optional description">
                    </div>
                </div>

                <div class="mb-3 row">
                    <div class="col-sm-3"></div>
                    <div class="col-sm-9">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="disabled" name="disabled"
                                   {% if route and route.disabled %}checked{% endif %}>
                            <label class="form-check-label" for="disabled">Disabled</label>
                            <small class="text-muted d-block">Disable without deleting</small>
                        </div>
                    </div>
                </div>

                <hr>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('routing.static_routes_page') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa fa-floppy-disk me-1"></i>Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
