{% extends 'base.html' %}

{% block main %}
<div class="container">
  <div class="ss-page-header">
    <div>
      <h1 class="ss-page-title">DNS Lookup</h1>
      <p class="ss-page-desc">Perform DNS resolution queries</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="ss-card">
        <div class="ss-card-head">
          <div class="ss-card-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
          <div><div class="ss-card-title">Query</div></div>
        </div>
        <div class="ss-card-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Hostname</label>
            <input type="text" id="dns-host" class="form-control" placeholder="example.com" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Record Type</label>
            <select id="dns-type" class="form-select">
              <option value="A">A (IPv4)</option>
              <option value="AAAA">AAAA (IPv6)</option>
              <option value="MX">MX</option>
              <option value="TXT">TXT</option>
              <option value="CNAME">CNAME</option>
            </select>
          </div>
          <button id="btn-lookup" class="btn btn-primary w-100">
            <i class="fa fa-search me-2"></i>Resolve
          </button>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="ss-card h-100">
        <div class="ss-card-head">
          <div class="ss-card-icon"><i class="fa-solid fa-list-check"></i></div>
          <div><div class="ss-card-title">Results</div></div>
        </div>
        <div style="overflow-x:auto;">
          <div id="dns-result" style="min-height:220px;padding:1rem;">
            <span class="text-muted">Enter a hostname and click Resolve.</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('btn-lookup').addEventListener('click', function () {
  const host = document.getElementById('dns-host').value.trim();
  const type = document.getElementById('dns-type').value;
  if (!host) { alert('Enter a hostname.'); return; }
  const out = document.getElementById('dns-result');
  out.innerHTML = '<span class="text-muted"><i class="fa fa-spinner fa-spin me-2"></i>Resolving…</span>';
  this.disabled = true;
  fetch('/diagnostics/api/dns-lookup', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ host, type })
  })
  .then(r => r.json())
  .then(d => {
    if (d.error) {
      out.innerHTML = `<div class="alert alert-danger mb-0"><i class="fa fa-xmark me-2"></i>${d.error}</div>`;
      return;
    }
    const rows = (d.results || []).map(r =>
      `<tr><td><code>${r.address || r}</code></td><td class="text-muted">${r.type || type}</td></tr>`
    ).join('');
    out.innerHTML = rows
      ? `<div class="table-responsive"><table class="table table-hover mb-0">
           <thead><tr><th>Address</th><th>Type</th></tr></thead>
           <tbody>${rows}</tbody></table></div>`
      : '<div class="alert alert-warning mb-0">No records found.</div>';
  })
  .catch(e => { out.innerHTML = `<div class="alert alert-danger mb-0">Request failed: ${e.message}</div>`; })
  .finally(() => { document.getElementById('btn-lookup').disabled = false; });
});
document.getElementById('dns-host').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-lookup').click();
});
</script>
{% endblock %}
