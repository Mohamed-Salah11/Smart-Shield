{% extends 'base.html' %}

{% block main %}
<div class="container">
  <div class="ss-page-header">
    <div>
      <h1 class="ss-page-title">Test Port</h1>
      <p class="ss-page-desc">Check TCP/UDP port connectivity</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="ss-card">
        <div class="ss-card-head">
          <div class="ss-card-icon"><i class="fa-solid fa-plug"></i></div>
          <div><div class="ss-card-title">Parameters</div></div>
        </div>
        <div class="ss-card-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Host / IP</label>
            <input type="text" id="pt-host" class="form-control" placeholder="192.168.1.1 or example.com" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Port</label>
            <input type="number" id="pt-port" class="form-control" placeholder="443" min="1" max="65535">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Timeout (seconds)</label>
            <select id="pt-timeout" class="form-select">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
            </select>
          </div>
          <button id="btn-test" class="btn btn-primary w-100">
            <i class="fa fa-plug me-2"></i>Test Connection
          </button>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="ss-card h-100">
        <div class="ss-card-head">
          <div class="ss-card-icon"><i class="fa-solid fa-circle-check"></i></div>
          <div><div class="ss-card-title">Result</div></div>
        </div>
        <div class="ss-card-body">
          <div id="pt-result" class="text-muted">Enter a host and port then click Test.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('btn-test').addEventListener('click', function () {
  const host    = document.getElementById('pt-host').value.trim();
  const port    = parseInt(document.getElementById('pt-port').value);
  const timeout = parseInt(document.getElementById('pt-timeout').value);
  if (!host || !port) { alert('Enter a host and port.'); return; }
  const out = document.getElementById('pt-result');
  out.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>Connecting…';
  this.disabled = true;
  fetch('/diagnostics/api/test-port', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ host, port, timeout })
  })
  .then(r => r.json())
  .then(d => {
    out.innerHTML = d.open
      ? `<div class="alert alert-success mb-0"><i class="fa fa-circle-check me-2"></i><strong>${host}:${port}</strong> is reachable. (${d.elapsed_ms}ms)</div>`
      : `<div class="alert alert-danger mb-0"><i class="fa fa-circle-xmark me-2"></i><strong>${host}:${port}</strong> is unreachable. ${d.error || ''}</div>`;
  })
  .catch(e => { out.innerHTML = `<div class="alert alert-danger mb-0">Request failed: ${e.message}</div>`; })
  .finally(() => { document.getElementById('btn-test').disabled = false; });
});
</script>
{% endblock %}
