<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(145deg, #1c3c5a, #0e2439);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .login-box {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            width: 360px;
            padding: 40px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 25px;
            color: #1a3958;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #1c3c5a;
            border: none;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-box button:hover {
            background-color: #244b6e;
        }

        .error {
            color: #d33;
            margin-bottom: 10px;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            width: 100px;
        }

        footer {
            position: absolute;
            bottom: 10px;
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/zgate.png') }}" alt="Logo" width="120">
        </div>
        <h2>Firewall Login</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <footer>© 2025 Secure Firewall Portal</footer>
</body>
</html>
