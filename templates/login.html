<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShield — Sign In</title>
    <link rel="stylesheet" href="{{ static_v('vendor/inter/inter.css') }}">
    <link rel="stylesheet" href="{{ static_v('vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_v('css/login.css') }}">
</head>
<body>

    <!-- Ambient glow scene -->
    <div class="login-scene"></div>

    <div class="login-box">

        <!-- Shield logo -->
        <div class="logo">
            <img src="{{ static_v('images/SS.png') }}" alt="SmartShield">
        </div>

        <h2>SmartShield</h2>
        <p class="login-subtitle">Network Defense Platform</p>

        <div class="login-edition">
            <i class="fa-solid fa-shield-halved"></i>
            Firewall OS
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>

            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <div class="login-btn-wrap">
                <button type="submit">
                    <i class="fa-solid fa-arrow-right-to-bracket ext-d109945c"></i>
                    Sign In
                </button>
            </div>
        </form>
    </div>

    <footer>SmartShield &nbsp;·&nbsp; Network Defense Platform &nbsp;·&nbsp; &copy; 2025</footer>

</body>
</html>
