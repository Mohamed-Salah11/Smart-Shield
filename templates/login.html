<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shield — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <!-- Ambient glow scene -->
    <div class="login-scene"></div>

    <div class="login-box">

        <!-- Shield logo -->
        <div class="logo">
            <img src="{{ url_for('static', filename='images/SS.png') }}" alt="Smart Shield">
        </div>

        <h2>Smart Shield</h2>
        <p class="login-subtitle">Network Defense Platform</p>

        <div class="login-edition">
            <i class="fa-solid fa-shield-halved"></i>
            Firewall OS
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>

            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <div class="login-btn-wrap">
                <button type="submit">
                    <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right:8px;"></i>
                    Sign In
                </button>
            </div>
        </form>
    </div>

    <footer>Smart Shield &nbsp;·&nbsp; Network Defense Platform &nbsp;·&nbsp; &copy; 2025</footer>

</body>
</html>
