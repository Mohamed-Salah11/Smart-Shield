{% extends 'base.html' %}

{% block main %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0">
            <li class="breadcrumb-item">Wizard</li>
            <li class="breadcrumb-item"><a href="{{ url_for('system.setup_wizard') }}">ZGate Setup</a></li>
            <li class="breadcrumb-item active" aria-current="page">Configure LAN Interface</li>
        </ol>
    </nav>

    <div class="mb-2">
        <div class="progress" style="height:6px;">
            <div class="progress-bar bg-danger" role="progressbar" style="width:55%;" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="mt-2">
            <span class="badge bg-danger">Step 5 of 9</span>
        </div>
    </div>

    <form method="post" action="#">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">Configure LAN Interface</div>
            <div class="card-body">
                <p>On this screen the Local Area Network information will be configured.</p>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">LAN IP Address</label>
                    <div class="col-sm-4">
                        <input class="form-control" name="lan_ip" value="10.0.0.1">
                        <div class="form-text">Type dhcp if this interface uses DHCP to obtain its IP address.</div>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Subnet Mask</label>
                    <div class="col-sm-2">
                        <select class="form-select" name="lan_subnet">
                            {% for n in range(1,33) %}
                            <option value="{{n}}" {% if n==24 %}selected{% endif %}>{{n}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

            </div>
        </div>

        <div class="mt-3">
            <a href="{{ url_for('system.setup_wizard_step', step=7) }}" class="btn btn-primary">&raquo;&raquo; Next</a>
        </div>
    </form>
</div>
{% endblock %}
