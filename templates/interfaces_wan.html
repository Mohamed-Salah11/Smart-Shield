{% extends 'base.html' %}

{% block main %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAN Interface Configuration</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background-color: #f2f3f7;
      margin: 0;
      padding: 20px 40px;
      color: #333;
    }

    h2 {
      font-size: 16px;
      color: #cc0000; /* red accent */
      border-bottom: 2px solid #cc0000;
      padding-bottom: 6px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 25px;
      padding: 20px;
      background-color: #fff;
    }

    legend {
      font-weight: bold;
      font-size: 14px;
      color: #cc0000;
      padding: 0 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 50%;
      padding: 6px 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
    }

    input[type="checkbox"] {
      margin-right: 6px;
      transform: scale(1.1);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-size: 12px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      background-color: #cc0000;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #e60000;
    }

    .secondary {
      background-color: #888;
    }

    .secondary:hover {
      background-color: #555;
    }

    /* Layout styling */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>WAN Interface Configuration</h2>

    <!-- General Configuration -->
    <fieldset>
      <legend>General Configuration</legend>

      <div class="checkbox-label">
        <input type="checkbox" id="enable">
        <label for="enable">Enable Interface</label>
      </div>

      <label for="description">Description</label>
      <input type="text" id="description" placeholder="WAN">

      <label for="ipv4type">IPv4 Configuration Type</label>
      <select id="ipv4type">
        <option>DHCP</option>
        <option>Static IPv4</option>
        <option>PPPoE</option>
        <option>PPTP</option>
        <option>L2TP</option>
        <option>None</option>
      </select>

      <label for="ipv6type">IPv6 Configuration Type</label>
      <select id="ipv6type">
        <option>None</option>
        <option>Static IPv6</option>
        <option>DHCP6</option>
        <option>SLAAC</option>
      </select>

      <label for="mac">MAC Address</label>
      <input type="text" id="mac" placeholder="00:11:22:33:44:55">

      <label for="mtu">MTU</label>
      <input type="text" id="mtu" placeholder="1500">

      <label for="mss">MSS</label>
      <input type="text" id="mss" placeholder="">

      <label for="speed">Speed and Duplex</label>
      <select id="speed">
        <option>Default (negotiated)</option>
        <option>10baseT full-duplex</option>
        <option>100baseTX full-duplex</option>
        <option>1000baseT full-duplex</option>
      </select>
    </fieldset>

    <!-- Static IPv4 Configuration -->
    <fieldset>
      <legend>Static IPv4 Configuration</legend>

      <label for="ipv4addr">IPv4 Address</label>
      <input type="text" id="ipv4addr" placeholder="203.0.113.2/24">

      <label for="ipv4gw">IPv4 Upstream Gateway</label>
      <input type="text" id="ipv4gw" placeholder="203.0.113.1">
    </fieldset>

    <!-- PPPoE Configuration -->
    <fieldset>
      <legend>PPPoE Configuration</legend>

      <label for="pppoeuser">Username</label>
      <input type="text" id="pppoeuser" placeholder="user@example.com">

      <label for="pppoepass">Password</label>
      <input type="password" id="pppoepass" placeholder="••••••••">

      <div class="checkbox-label">
        <input type="checkbox" id="pppoerelay">
        <label for="pppoerelay">Dial on demand</label>
      </div>

      <label for="idletimeout">Idle timeout (seconds)</label>
      <input type="text" id="idletimeout" placeholder="0 (disable)">
    </fieldset>

    <!-- Reserved Networks -->
    <fieldset>
      <legend>Reserved Networks</legend>

      <div class="checkbox-label">
        <input type="checkbox" id="blockprivate">
        <label for="blockprivate">Block private networks and loopback addresses</label>
      </div>

      <div class="checkbox-label">
        <input type="checkbox" id="blockbogons">
        <label for="blockbogons">Block bogon networks</label>
      </div>
    </fieldset>

    <div class="btn-group">
      <button class="secondary">Cancel</button>
      <button>Save</button>
    </div>
  </div>

</body>
{% endblock %}
