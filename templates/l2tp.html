{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">
	Dashboard / VPN / L2TP
</div>

<ul class="nav nav-tabs">
	<li class="nav-item">
		<a class="nav-link active" href="{{ url_for('vpn.l2tp') }}">Configuration</a>
	</li>
	<li class="nav-item">
		<a class="nav-link" href="{{ url_for('vpn.l2tp_users') }}">Users</a>
	</li>
</ul>

<div class="settings-section">
	<h5 class="openvpn-section-title">L2TP Configuration</h5>

	<div class="openvpn-section-body">
		<div class="openvpn-form-section">
			<div class="openvpn-form-section-title">Enable L2TP</div>

			<div class="row align-items-center mb-3">
				<div class="col-md-3 fw-semibold">Enable</div>
				<div class="col-md-9">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="l2tpEnable" checked>
						<label class="form-check-label" for="l2tpEnable">Enable L2TP server</label>
					</div>
				</div>
			</div>

			<div class="mt-4">
				<button type="button" class="btn btn-primary" id="saveL2tpConfig">Save</button>
			</div>
		</div>

		<div class="alert alert-info mt-4" role="alert">
			Don't forget to add a firewall rule to permit traffic from L2TP clients.
		</div>
	</div>
</div>

<script>
	document.addEventListener('DOMContentLoaded', function () {
		// Load L2TP configuration
		fetch('/vpn/api/l2tp/get-config')
			.then(response => response.json())
			.then(data => {
				if (data.status === 'success') {
					document.getElementById('l2tpEnable').checked = data.enabled;
				}
			})
			.catch(error => console.error('Error:', error));

		// Save L2TP configuration
		document.getElementById('saveL2tpConfig').addEventListener('click', function () {
			const formData = {
				enabled: document.getElementById('l2tpEnable').checked
			};

			fetch('/vpn/api/l2tp/save-config', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(formData)
			})
				.then(response => response.json())
				.then(data => {
					if (data.status === 'success') {
						alert('L2TP configuration saved successfully!');
					} else {
						alert('Error: ' + (data.message || 'Unknown error'));
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('Error saving L2TP configuration');
				});
		});
	});
</script>

{% endblock %}
