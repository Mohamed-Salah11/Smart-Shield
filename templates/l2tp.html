{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">
	Dashboard / VPN / L2TP
</div>

<ul class="nav nav-tabs">
	<li class="nav-item">
		<a class="nav-link active" href="{{ url_for('vpn.l2tp') }}">Configuration</a>
	</li>
	<li class="nav-item">
		<a class="nav-link" href="{{ url_for('vpn.l2tp_users') }}">Users</a>
	</li>
</ul>

<div class="settings-section">
	<h5 class="openvpn-section-title">L2TP Configuration</h5>

	<div class="openvpn-section-body">
		<div class="openvpn-form-section">
			<div class="openvpn-form-section-title">Enable L2TP</div>

			<div class="row align-items-center mb-3">
				<div class="col-md-3 fw-semibold">Enable</div>
				<div class="col-md-9">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="l2tpEnable" checked>
						<label class="form-check-label" for="l2tpEnable">Enable L2TP server</label>
					</div>
				</div>
			</div>

			<div class="mt-4">
					<button type="button" class="btn btn-primary" id="l2tpSaveBtn">Save</button>
			</div>
		</div>

		<div class="alert alert-info mt-4" role="alert">
			Don't forget to add a firewall rule to permit traffic from L2TP clients.
		</div>
	</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
	loadL2tpSettings();
	const btn = document.getElementById('l2tpSaveBtn');
	if (btn) btn.addEventListener('click', saveL2tpSettings);
});

function loadL2tpSettings() {
	fetch('/vpn/api/l2tp/settings')
		.then(r => {
			if (!r.ok) throw new Error(`HTTP ${r.status}`);
			return r.json();
		})
		.then(json => {
			if (!json.success) throw new Error(json.error || 'Failed to load L2TP settings');
			const enabled = (json.settings && typeof json.settings.enabled !== 'undefined') ? json.settings.enabled : 1;
			const cb = document.getElementById('l2tpEnable');
			if (cb) cb.checked = !!enabled;
		})
		.catch(err => console.error('Load L2TP settings failed:', err));
}

function saveL2tpSettings() {
	const cb = document.getElementById('l2tpEnable');
	const payload = { enabled: cb ? !!cb.checked : true };

	fetch('/vpn/api/l2tp/settings', {
		method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify(payload)
	})
		.then(r => r.json())
		.then(json => {
			if (!json.success) {
				alert(json.error || 'Failed to save');
				return;
			}
			alert('Saved successfully');
		})
		.catch(err => {
			console.error(err);
			alert(err.message || String(err));
		});
}
</script>
{% endblock %}
