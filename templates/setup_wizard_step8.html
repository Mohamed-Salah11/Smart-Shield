{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">Wizard / Smart Shield Setup / Reload Configuration</div>

<div class="mb-3">
        <div class="progress" style="height:6px;">
            <div class="progress-bar bg-danger" role="progressbar" style="width:77%;" aria-valuenow="77" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="mt-2">
            <span class="badge bg-danger">Step 7 of 9</span>
        </div>
    </div>

    <div class="settings-section">
        <div style="background: #333; color: white; padding: 20px 25px; margin: -20px -20px 20px -20px; border-radius: 4px 4px 0 0; font-size: 18px; font-weight: 500;">Reload configuration</div>
            <p>Click 'Reload' to reload Smart Shield with new changes.</p>
    </div>

    <div class="d-flex justify-content-start mt-3">
        <a href="{{ url_for('system.setup_wizard_step', step=9) }}" class="btn btn-primary">&raquo;&raquo; Reload</a>
    </div>
{% endblock %}
