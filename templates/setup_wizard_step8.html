{% extends 'base.html' %}

{% block main %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0">
            <li class="breadcrumb-item">Wizard</li>
            <li class="breadcrumb-item"><a href="{{ url_for('setup_wizard') }}">ZGate Setup</a></li>
            <li class="breadcrumb-item active" aria-current="page">Reload configuration</li>
        </ol>
    </nav>

    <div class="mb-2">
        <div class="progress" style="height:6px;">
            <div class="progress-bar bg-danger" role="progressbar" style="width:77%;" aria-valuenow="77" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="mt-2">
            <span class="badge bg-danger">Step 7 of 9</span>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">Reload configuration</div>
        <div class="card-body">
            <p>Click 'Reload' to reload ZGate with new changes.</p>
        </div>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('setup_wizard_step', step=9) }}" class="btn btn-primary">&raquo;&raquo; Reload</a>
    </div>
</div>
{% endblock %}
