{# Shared partial: enforcement-mode selector for DNS / Web / App filter pages.
   Loads the current mode via /filters/api/content-policy/mode and saves
   changes back to the same endpoint. #}
<div class="page-card ext-b830ea1e">
  <div class="ext-7b62ef99">
    <p class="page-title ext-e974c662">Content Policy Mode</p>
    <p class="page-sub" id="content-policy-mode-desc">Loading…</p>
  </div>
  <div>
    <select id="content-policy-mode" class="form-control form-control-sm ext-0ee12551"

            data-action-change="h_e85aacaaea">
      <option value="dns_redirect_block_page">Redirect to block page (default)</option>
      <option value="dns_nxdomain_only">DNS NXDOMAIN only (no portal)</option>
      <option value="captive_auth_required">Captive auth required for bypass</option>
      <option value="whitelist_only">Whitelist only — block everyone else</option>
    </select>
  </div>
</div>

<script nonce="{{ csp_nonce() }}">
(function () {
  const DESC = {
    "dns_redirect_block_page": "Blocked domains resolve to the SmartShield LAN IP and show the in-browser block page. No portal login required.",
    "dns_nxdomain_only":       "Blocked domains return NXDOMAIN. Useful when you want the browser to fail closed without showing any branded block page.",
    "captive_auth_required":   "Same DNS redirect as the default, but the block page demands the user log in through the captive portal before any bypass is granted.",
    "whitelist_only":          "Only devices in the device_whitelist (or with an active admin_bypass session) can reach blocked domains. Everyone else sees the block page.",
  };

  function updateDesc(value) {
    document.getElementById("content-policy-mode-desc").textContent =
      DESC[value] || "";
  }

  window.saveContentPolicyMode = async function () {
    const sel = document.getElementById("content-policy-mode");
    const mode = sel.value;
    try {
      const r = await fetch("/filters/api/content-policy/mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({mode: mode}),
      });
      const d = await r.json();
      if (typeof showToast === "function") {
        showToast(d.ok ? "Content policy mode saved." : "Error: " + (d.message || "Save failed"), d.ok);
      }
      updateDesc(mode);
    } catch (e) {
      if (typeof showToast === "function") showToast("Network error: " + e.message, false);
    }
  };

  async function loadContentPolicyMode() {
    try {
      const r = await fetch("/filters/api/content-policy/mode");
      const d = await r.json();
      if (d && d.ok && d.mode) {
        document.getElementById("content-policy-mode").value = d.mode;
        updateDesc(d.mode);
      }
    } catch (_) { /* leave default */ }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadContentPolicyMode);
  } else {
    loadContentPolicyMode();
  }
})();
</script>
