{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">
	<span>Services / SNMP</span>
</div>

<div class="settings-section">
	<h5>SNMP Daemon</h5>
	
	<div class="form-group">
		<label>Enable SNMP</label>
		<div class="form-group-content">
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="snmpEnable">
				<label class="form-check-label" for="snmpEnable">Enable SNMP Daemon and its controls</label>
			</div>
		</div>
	</div>
</div>

<div class="settings-section" id="snmpSettings">
	<h5>SNMP Daemon Settings</h5>

	<div class="form-group">
		<label>Polling Port</label>
		<div class="form-group-content">
			<input type="number" class="form-control" id="snmpPort" placeholder="161" style="max-width: 150px;">
		</div>
	</div>

	<div class="form-group">
		<label>System Location</label>
		<div class="form-group-content">
			<input type="text" class="form-control" id="systemLocation" placeholder="Server Room" style="max-width: 300px;">
		</div>
	</div>

	<div class="form-group">
		<label>System Contact</label>
		<div class="form-group-content">
			<input type="text" class="form-control" id="systemContact" placeholder="admin@example.com" style="max-width: 300px;">
		</div>
	</div>

	<div class="form-group">
		<label>Read Community String</label>
		<div class="form-group-content">
			<input type="text" class="form-control" id="readCommunity" placeholder="public" style="max-width: 300px;">
		</div>
	</div>
</div>

<div class="settings-section">
	<h5>SNMP Traps</h5>
	
	<div class="form-group">
		<label>Enable SNMP Traps</label>
		<div class="form-group-content">
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="snmpTrapEnable">
				<label class="form-check-label" for="snmpTrapEnable">Enable SNMP Trap and its controls</label>
			</div>
		</div>
	</div>
</div>

<div class="settings-section">
	<h5>SNMP Modules</h5>
	
	<div class="form-group">
		<label>Modules</label>
		<div class="form-group-content">
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="moduleMBIL">
				<label class="form-check-label" for="moduleMBIL">MBIL</label>
			</div>
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="moduleNetgraph">
				<label class="form-check-label" for="moduleNetgraph">Netgraph</label>
			</div>
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="modulePF">
				<label class="form-check-label" for="modulePF">PF</label>
			</div>
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="moduleHostRes">
				<label class="form-check-label" for="moduleHostRes">Host Resources</label>
			</div>
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="moduleUCD">
				<label class="form-check-label" for="moduleUCD">UCD</label>
			</div>
			<div class="form-check">
				<input type="checkbox" class="form-check-input" id="moduleRegex">
				<label class="form-check-label" for="moduleRegex">Regex</label>
			</div>
		</div>
	</div>
</div>

<div class="settings-section">
	<h5>Interface Binding</h5>

	<div class="form-group">
		<label>Internet Protocol</label>
		<div class="form-group-content">
			<select class="form-control" id="ipProtocol" style="max-width: 200px;">
				<option>IPv4</option>
				<option>IPv6</option>
			</select>
		</div>
	</div>

	<div class="form-group">
		<label>Bind Interfaces</label>
		<div class="form-group-content">
			<select class="form-control" id="bindInterface" style="max-width: 200px;">
				<option>All</option>
				<option>WAN</option>
				<option>LAN</option>
				<option>Localhost</option>
			</select>
		</div>
	</div>
</div>

<div class="d-flex gap-2 mt-3">
	<button type="button" class="btn btn-primary" onclick="saveSNMP()">Save</button>
</div>

<script>
document.getElementById('snmpEnable').addEventListener('change', function() {
	const enabled = this.checked;
	document.querySelectorAll('#snmpSettings input').forEach(inp => inp.disabled = !enabled);
});

document.getElementById('snmpTrapEnable').addEventListener('change', function() {
	const trapEnabled = this.checked;
	document.querySelectorAll('.checkbox-group input').forEach(inp => inp.disabled = !trapEnabled);
});

function saveSNMP() {
	const config = {
		snmpEnabled: document.getElementById('snmpEnable').checked,
		port: document.getElementById('snmpPort').value,
		location: document.getElementById('systemLocation').value,
		contact: document.getElementById('systemContact').value,
		community: document.getElementById('readCommunity').value,
		trapsEnabled: document.getElementById('snmpTrapEnable').checked,
		modules: {
			mbil: document.getElementById('moduleMBIL').checked,
			netgraph: document.getElementById('moduleNetgraph').checked,
			pf: document.getElementById('modulePF').checked,
			hostResources: document.getElementById('moduleHostRes').checked,
			ucd: document.getElementById('moduleUCD').checked,
			regex: document.getElementById('moduleRegex').checked
		},
		interfaceBinding: {
			ipProtocol: document.getElementById('ipProtocol').value,
			bindInterface: document.getElementById('bindInterface').value
		}
	};
	console.log('SNMP Configuration:', config);
	alert('SNMP settings saved (check console for details).');
}
</script>

{% endblock %}
