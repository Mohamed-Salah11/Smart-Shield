{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">Wizard / ZGate Setup / Reload in Progress</div>

<div class="mb-3">
        <div class="progress" style="height:6px;">
            <div class="progress-bar bg-danger" role="progressbar" style="width:88%;" aria-valuenow="88" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="mt-2">
            <span class="badge bg-danger">Step 8 of 9</span>
        </div>
    </div>

    <div class="settings-section">
        <div style="background: #333; color: white; padding: 20px 25px; margin: -20px -20px 20px -20px; border-radius: 4px 4px 0 0; font-size: 18px; font-weight: 500;">Reload in progress</div>
            <p>A reload is now in progress. Please wait.</p>
            <p>The wizard will redirect to the next step once the reload is completed.</p>
    </div>

    <script>
    // Simulate reload progress then redirect to the final completion page after a short delay.
    setTimeout(function() {
        window.location.href = "{{ url_for('system.setup_wizard_step', step=10) }}";
    }, 3000);
    </script>
{% endblock %}
