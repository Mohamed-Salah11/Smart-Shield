<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Status: CARP (Failover) - pfSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 70px; background: #f5f5f5; font-family: Arial, sans-serif; }
    .navbar-brand { font-weight: bold; }
    .breadcrumb { background: #fff; border: 1px solid #ddd; margin-bottom: 20px; }
    .alert-warning {
      background-color: #fcf8e3;
      border-left: 5px solid #f0ad4e;
      color: #8a6d3b;
      padding: 10px 15px;
      margin-bottom: 20px;
      position: relative;
    }
    .alert-warning .line1 { color: #c09853; font-weight: bold; }
    .alert-warning .line2 { color: #999; font-size: 0.9em; }
    .close-btn { position: absolute; top: 10px; right: 10px; font-size: 18px; color: #999; cursor: pointer; }
    .panel { box-shadow: none; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">pfSense</a>
      </div>
    </div>
  </nav>

  <ol class="breadcrumb container-fluid">
    <li><a href="{{ url_for('status') }}">Status</a></li>
    <li class="active">CARP</li>
  </ol>

  <div class="container-fluid">
    <div class="alert alert-warning" id="warning-alert">
      <span class="close-btn" onclick="document.getElementById('warning-alert').style.display='none'">&times;</span>
      <div class="line1">{{ line1 }}</div>
      <div class="line2">{{ line2 }}</div>
    </div>

    <div class="panel panel-default">
      <div class="panel-heading"><h3 class="panel-title">CARP Status</h3></div>
      <div class="panel-body text-center text-muted">
        <em>No CARP interfaces defined.</em>
      </div>
    </div>
  </div>

  <script>
    // الـ X يخفي الرسالة
    document.querySelector('.close-btn').addEventListener('click', function() {
      this.parentElement.style.display = 'none';
    });
  </script>
</body>
</html>
