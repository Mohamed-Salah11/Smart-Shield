{% extends 'base.html' %}

{% block main %}
<div class="breadcrumb">
	<span>Services / Router Advertisement</span>
</div>

<ul class="nav nav-tabs mb-3">
	<li class="nav-item">
		<a class="nav-link active" id="tab-wan" href="#" onclick="switchTab('WAN'); return false;">WAN</a>
	</li>
	<li class="nav-item">
		<a class="nav-link" id="tab-lan" href="#" onclick="switchTab('LAN'); return false;">LAN</a>
	</li>
</ul>

<!-- WAN TAB -->
<div id="WAN" class="tab-content">
	<div class="settings-section">
		<h5>Router Advertisement</h5>

		<div class="form-group">
			<label>Router Mode</label>
			<div class="form-group-content">
				<select class="form-control">
					<option>Disabled</option>
					<option>Enabled</option>
				</select>
			</div>
		</div>

		<div class="form-group">
			<label>Router Priority</label>
			<div class="form-group-content">
				<select class="form-control">
					<option>Low</option>
					<option>Medium</option>
					<option>High</option>
				</select>
			</div>
		</div>

		<div class="form-group">
			<label>Valid Lifetime (seconds)</label>
			<div class="form-group-content">
				<input type="number" value="86400" class="form-control" style="max-width: 150px;">
			</div>
		</div>

		<div class="form-group">
			<label>Preferred Lifetime (seconds)</label>
			<div class="form-group-content">
				<input type="number" value="14400" class="form-control" style="max-width: 150px;">
			</div>
		</div>

		<div class="form-group">
			<label>Minimum RA Interval (seconds)</label>
			<div class="form-group-content">
				<input type="number" value="200" class="form-control" style="max-width: 150px;">
			</div>
		</div>

		<div class="form-group">
			<label>Maximum RA Interval (seconds)</label>
			<div class="form-group-content">
				<input type="number" value="600" class="form-control" style="max-width: 150px;">
			</div>
		</div>

		<div class="form-group">
			<label>Router Lifetime (seconds)</label>
			<div class="form-group-content">
				<input type="number" value="1800" class="form-control" style="max-width: 150px;">
			</div>
		</div>

		<div class="form-group">
			<label>NAT64 Prefix</label>
			<div class="form-group-content">
				<input type="text" value="64:ff9b::/96" class="form-control" style="max-width: 250px;">
			</div>
		</div>

		<div class="form-group">
			<label>NAT64 Prefix Lifetime (seconds)</label>
			<div class="form-group-content">
				<input type="number" value="1800" class="form-control" style="max-width: 150px;">
			</div>
		</div>

		<div class="form-group">
			<label>RA Subnet(s)</label>
			<div class="form-group-content">
				<div id="raSubnetsWAN"></div>
				<button type="button" class="btn btn-success mt-2" onclick="addRASubnet('WAN')">Add RA Subnet</button>
			</div>
		</div>
	</div>

	<div class="settings-section">
		<h5>DNS Configuration</h5>

		<div class="form-group">
			<label>DNS Options</label>
			<div class="form-group-content">
				<div class="form-check">
					<input type="checkbox" class="form-check-input" id="dnsEnableWAN">
					<label class="form-check-label" for="dnsEnableWAN">Enable DNS via RA Daemon</label>
				</div>
				<div class="form-check">
					<input type="checkbox" class="form-check-input" id="mirrorDHCPWAN">
					<label class="form-check-label" for="mirrorDHCPWAN">Mirror DHCPv6 DNS Configuration</label>
				</div>
			</div>
		</div>

		<div class="form-group">
			<label>DNS Server 1</label>
			<div class="form-group-content">
				<input type="text" placeholder="DNS Server 1" class="form-control" style="max-width: 250px;">
			</div>
		</div>

		<div class="form-group">
			<label>DNS Server 2</label>
			<div class="form-group-content">
				<input type="text" placeholder="DNS Server 2" class="form-control" style="max-width: 250px;">
			</div>
		</div>

		<div class="form-group">
			<label>DNS Server 3</label>
			<div class="form-group-content">
				<input type="text" placeholder="DNS Server 3" class="form-control" style="max-width: 250px;">
			</div>
		</div>

		<div class="form-group">
			<label>DNS Server 4</label>
			<div class="form-group-content">
				<input type="text" placeholder="DNS Server 4" class="form-control" style="max-width: 250px;">
			</div>
		</div>

		<div class="form-group">
			<label>Domain Search List</label>
			<div class="form-group-content">
				<input type="text" placeholder="example.com;sub.example.com" class="form-control" style="max-width: 350px;">
			</div>
		</div>
	</div>

	<div class="d-flex gap-2 mt-3">
		<button type="submit" class="btn btn-primary">Save</button>
	</div>
</div>

<script>
function switchTab(tabName) {
	document.querySelectorAll('.nav-link').forEach(t => t.classList.remove('active'));
	document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
	document.getElementById('tab-' + tabName.toLowerCase()).classList.add('active');
	document.getElementById(tabName).style.display = 'block';
}

function addRASubnet(tab) {
	const container = document.getElementById('raSubnets' + tab);
	const div = document.createElement('div');
	div.className = 'd-flex gap-2 mb-2';
	div.innerHTML = `
		<input type="text" placeholder="RA Subnet (CIDR)" class="form-control" style="max-width: 200px;">
		<input type="number" placeholder="/128" value="128" class="form-control" style="max-width: 80px;">
		<button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">Delete</button>
	`;
	container.appendChild(div);
}

// Initialize WAN tab on page load
window.onload = () => switchTab('WAN');
</script>
