<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Portal — Sign In</title>
  <link rel="stylesheet" href="{{ static_v('vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ static_v('vendor/fontawesome/css/all.min.css') }}">
  <link href="{{ static_v('vendor/inter/inter.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_v('css/soc-portal.css') }}">
  <style nonce="{{ csp_nonce() }}">
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at 60% 30%, #0f1f3d 0%, #0a0f1e 70%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    .soc-login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }
    .soc-login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .soc-login-logo i { font-size: 2.5rem; color: #00b4a0; }
    .soc-login-logo h1 { font-size: 1.4rem; font-weight: 800; color: #4dd9cd; margin: .5rem 0 .2rem; }
    .soc-login-logo p { color: #94a3b8; font-size: .85rem; }
    .soc-login-box {
      background: #111827;
      border: 1px solid #2a3550;
      border-radius: 16px;
      padding: 2rem;
    }
    .soc-login-box label { font-size: .85rem; font-weight: 600; color: #94a3b8; margin-bottom: .4rem; display: block; }
    .soc-login-box .form-control {
      background: #0d1526;
      border: 1px solid #2a3550;
      color: #e2e8f0;
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .9rem;
    }
    .soc-login-box .form-control:focus {
      background: #0d1526;
      border-color: #00b4a0;
      color: #e2e8f0;
      box-shadow: 0 0 0 3px rgba(0,180,160,.15);
    }
    .soc-login-box .form-control::placeholder { color: #4a5568; }
    .btn-soc-login {
      width: 100%;
      background: linear-gradient(135deg, #00b4a0, #0090a0);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .7rem;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
      margin-top: .5rem;
      transition: opacity .15s;
    }
    .btn-soc-login:hover { opacity: .9; }
    .soc-error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      color: #fca5a5;
      padding: .65rem 1rem;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
    .soc-tier-info {
      margin-top: 1.5rem;
      display: flex;
      gap: .5rem;
      justify-content: center;
    }
    .soc-tier-chip {
      font-size: .7rem;
      font-weight: 700;
      padding: .2rem .55rem;
      border-radius: 4px;
      letter-spacing: .06em;
    }
    .soc-footer { text-align: center; margin-top: 1.5rem; color: #4a5568; font-size: .78rem; }
  </style>
</head>
<body>
  <div class="soc-login-wrap">
    <div class="soc-login-logo">
      <i class="fa-solid fa-shield-halved"></i>
      <h1>SOC Portal</h1>
      <p>SmartShield Security Operations Center</p>
    </div>

    <div class="soc-login-box">
      {% if error %}
      <div class="soc-error"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('soc_portal.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control"
                 placeholder="analyst@soc" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-soc-login">
          <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
        </button>
      </form>

      <div class="soc-tier-info">
        <span class="soc-tier-chip ext-48296923">L1 Triage</span>
        <span class="soc-tier-chip ext-4abe544f">L2 Investigate</span>
        <span class="soc-tier-chip ext-a84c3ce2">L3 Respond</span>
      </div>
    </div>

    <div class="soc-footer">
      Access is restricted to authorized SOC analysts only.<br>
      <a class="ext-d118642b" href="{{ url_for('auth.login') }}">Admin UI</a>
    </div>
  </div>
</body>
</html>
