{% extends 'base.html' %}

{% block main %}
<div class="container">
  <div class="ss-page-header">
    <div>
      <h1 class="ss-page-title">Bandwidth Monitor</h1>
      <p class="ss-page-desc">Interface traffic graphs</p>
    </div>
  </div>

  <div class="ss-card">
    <div class="ss-card-head">
      <div class="ss-card-icon"><i class="fa-solid fa-wave-square"></i></div>
      <div><div class="ss-card-title">Bandwidth</div></div>
      <div class="ss-card-actions">
        <span class="badge bg-success" id="live-badge">
          <i class="fa fa-circle me-1" style="font-size:.55rem"></i>Live
        </span>
        <button id="btn-pause" class="btn btn-sm btn-outline-secondary">
          <i class="fa fa-pause me-1"></i>Pause
        </button>
      </div>
    </div>
    <div class="ss-card-body">
      <canvas id="trafficChart" style="width:100%;height:320px;"></canvas>
    </div>
  </div>

  <div class="ss-card mt-4">
    <div class="ss-card-head">
      <div class="ss-card-icon"><i class="fa-solid fa-table-list"></i></div>
      <div><div class="ss-card-title">Interface Summary</div></div>
    </div>
    <div class="ss-card-body p-0">
      <div id="iface-summary">
        <div class="p-3 text-muted text-center">
          <i class="fa fa-spinner fa-spin me-2"></i>Loading…
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script>
(function () {
  const MAX_POINTS = 60;
  const INTERVAL_MS = 2000;
  const labels = [], rxData = [], txData = [];
  let lastStats = {}, paused = false, errorStreak = 0;

  const liveBadge = document.getElementById('live-badge');

  function setStale(on) {
    if (on) {
      liveBadge.className = 'badge bg-warning text-dark';
      liveBadge.innerHTML = '<i class="fa fa-circle me-1" style="font-size:.55rem"></i>Stale';
    } else {
      liveBadge.className = 'badge bg-success';
      liveBadge.innerHTML = '<i class="fa fa-circle me-1" style="font-size:.55rem"></i>Live';
    }
  }

  const ctx = document.getElementById('trafficChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'RX (KB/s)', data: rxData, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.08)', tension: 0.4, fill: true, pointRadius: 0 },
        { label: 'TX (KB/s)', data: txData, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.08)', tension: 0.4, fill: true, pointRadius: 0 },
      ]
    },
    options: {
      animation: false, responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: '#94a3b8', maxTicksLimit: 10 } },
        y: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: '#94a3b8', callback: v => v + ' KB/s' }, beginAtZero: true }
      },
      plugins: { legend: { labels: { color: '#94a3b8' } } }
    }
  });

  function toKBs(deltaBytes) {
    return parseFloat(((deltaBytes * (1000 / INTERVAL_MS)) / 1024).toFixed(1));
  }

  function tick() {
    if (paused) return;
    fetch('/status/api/interface-stats')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => {
        if (!d.ok) { if (++errorStreak >= 2) setStale(true); return; }
        errorStreak = 0;
        setStale(false);

        let totalRx = 0, totalTx = 0;
        d.stats.forEach(s => {
          const prev = lastStats[s.name];
          if (prev) {
            totalRx += Math.max(0, s.rx_bytes - prev.rx_bytes);
            totalTx += Math.max(0, s.tx_bytes - prev.tx_bytes);
          }
          lastStats[s.name] = s;
        });

        labels.push(new Date().toLocaleTimeString());
        rxData.push(toKBs(totalRx));
        txData.push(toKBs(totalTx));
        if (labels.length > MAX_POINTS) { labels.shift(); rxData.shift(); txData.shift(); }
        chart.update('none');
        updateSummary(d.stats);
      })
      .catch(() => { if (++errorStreak >= 2) setStale(true); });
  }

  function fmt(b) {
    return b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB'
         : b >= 1048576   ? (b/1048576).toFixed(1)+' MB'
         : b >= 1024      ? (b/1024).toFixed(0)+' KB'
         : b + ' B';
  }

  function updateSummary(stats) {
    if (!stats.length) {
      document.getElementById('iface-summary').innerHTML = '<div class="p-3 text-muted text-center">No data.</div>';
      return;
    }
    const rows = stats.map(s => `<tr>
      <td><code>${s.name}</code></td>
      <td class="text-end">${fmt(s.rx_bytes)}</td>
      <td class="text-end">${fmt(s.tx_bytes)}</td>
      <td class="text-end">${s.rx_pkts.toLocaleString()}</td>
      <td class="text-end">${s.tx_pkts.toLocaleString()}</td>
      <td class="text-end text-danger">${(s.rx_errs + s.tx_errs).toLocaleString()}</td>
    </tr>`).join('');
    document.getElementById('iface-summary').innerHTML = `
      <div class="table-responsive"><table class="table table-hover mb-0" style="font-size:.85rem;">
        <thead style="background:var(--border-color-soft);"><tr>
          <th>Interface</th><th class="text-end">RX Bytes</th><th class="text-end">TX Bytes</th>
          <th class="text-end">RX Pkts</th><th class="text-end">TX Pkts</th><th class="text-end">Errors</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  setInterval(tick, INTERVAL_MS);
  tick();

  document.getElementById('btn-pause').addEventListener('click', function () {
    paused = !paused;
    this.innerHTML = paused ? '<i class="fa fa-play me-1"></i>Resume' : '<i class="fa fa-pause me-1"></i>Pause';
    liveBadge.style.opacity = paused ? '0.4' : '1';
  });
})();
</script>
{% endblock %}
